<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <defs>
    <!-- A restrained three-tone botanical gradient keeps the leaf varied but cohesive. -->
    <linearGradient id="leafGradient" x1="455" y1="790" x2="770" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5F9668"/>
      <stop offset="0.52" stop-color="#73AB6B"/>
      <stop offset="1" stop-color="#8DBA74"/>
    </linearGradient>
  </defs>

  <rect x="40" y="38" width="1174" height="1178" rx="224" ry="224" fill="#181818"/>

  <!-- Leaf scaled proportionally and shifted slightly below the lens center -->
  <g transform="translate(627 667) scale(1.10) translate(-606 -602.5)">
    <!-- Smooth leaf silhouette -->
    <path d="
      M 769 377
      C 735 410, 675 433, 606 458
      C 540 482, 493 511, 463 552
      C 438 586, 432 626, 440 665
      C 445 693, 456 718, 472 739
      C 480 757, 486 785, 489 818
      C 498 823, 507 827, 515 828
      C 514 805, 512 786, 522 771
      C 534 757, 557 757, 581 752
      C 638 743, 684 717, 718 676
      C 756 631, 773 575, 777 510
      C 780 459, 777 413, 769 377
      Z" fill="url(#leafGradient)"/>

    <!-- Smooth central vein: narrow at the tip and gradually wider toward the base -->
    <path d="
      M 474 818
      C 474 775, 481 733, 495 697
      C 511 662, 533 631, 562 603
      C 591 576, 624 553, 655 538
      C 625 555, 596 579, 569 608
      C 542 637, 521 669, 505 704
      C 494 734, 488 775, 489 818
      Z" fill="#181818"/>
  </g>

  <!-- Short, heavy handle that widens toward its rounded base -->
  <path d="
    M 817 871
    L 925 1005
    Q 965 1045, 1005 1005
    Q 1045 965, 1005 925
    L 871 817
    Z" fill="#D4DAD5"/>

  <!-- Lens drawn above the handle -->
  <circle cx="627" cy="627" r="316.3"
          fill="none" stroke="#D4DAD5" stroke-width="65.4"/>
</svg>
